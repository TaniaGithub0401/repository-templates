
name: Distribute repository templates

on:
  push:
    branches:
      - prototype-multi-gitter-templates
  workflow_dispatch:

jobs:
  distribute-templates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout template repository
        uses: actions/checkout@v4

      - name: Install Multi-Gitter
        run: |
          curl -fsSL https://raw.githubusercontent.com/lindell/multi-gitter/master/install.sh | sh

      - name: Distribute templates
        env:
          GITHUB_TOKEN: ${{ secrets.MULTI_GITTER_TOKEN }}
          TEMPLATES_DIR: ${{ github.workspace }}/templates
        run: |
          multi-gitter run "python3 $GITHUB_WORKSPACE/scripts/sync_templates.py" \
            -R TaniaGithub0401/actinia-core \
            --base-branch main \
            --git-type cmd \
            --dry-run \
            -m "Synchronize repository templates" \
            --pr-title "Synchronize shared repository templates" \
            --pr-body "Synchronize shared files from the central template repository." \
            -B sync-repository-templates \
            --author-name "github-actions[bot]" \
            --author-email "41898282+github-actions[bot]@users.noreply.github.com" \
            --log-level=debug
